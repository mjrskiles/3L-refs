[project]
name = "threelakes-figures"
version = "0.1.0"
description = "Build-time figure generator for threelakesmusic.com (never shipped)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "hypothesis>=6.115,<7",
  "pyyaml>=6,<7",
  "fonttools[woff]>=4.55,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
