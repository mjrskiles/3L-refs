[project]
name = "threelakes-figures"
version = "0.1.0"
description = "Build-time figure generator for threelakesarts.com (never shipped)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# fonttools dropped with tools/subset_fonts.py — font subsetting now happens
# upstream in 3L-design, and nothing here reads a font binary.
dev = [
  "pytest>=8.3,<9",
  "hypothesis>=6.115,<7",
  "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
