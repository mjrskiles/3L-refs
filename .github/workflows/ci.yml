name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  # Manual trigger. Also a diagnostic: if a dispatched run does not appear at all,
  # the problem is repo-level (Actions disabled/restricted), not this file.
  workflow_dispatch:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Sync Python env
        working-directory: figures
        run: uv sync --locked

      - name: Tests
        working-directory: figures
        run: uv run pytest -q

      # Same fetcher the dev machines use — one pin (tools/get_hugo.sh), and the
      # Linux tarball path stays continuously exercised for the Raspberry Pi.
      - name: Setup Hugo
        run: tools/get_hugo.sh

      # Resolves to the live Pages URL — the project subpath today, the custom
      # domain automatically once it's set in the repo's Pages settings. Nothing
      # here hardcodes a host, so DNS day needs no change to this file.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
        continue-on-error: true

      - name: Build site
        run: |
          BASE="${{ steps.pages.outputs.base_url }}"
          if [ -n "$BASE" ]; then
            echo "building for $BASE/"
            bin/hugo --gc --minify --cleanDestinationDir --baseURL "$BASE/"
          else
            echo "Pages not configured yet — falling back to hugo.toml baseURL"
            bin/hugo --gc --minify --cleanDestinationDir
          fi

      - name: No external origins
        working-directory: figures
        run: uv run python ../tools/check_origins.py ../public

      - name: Tags registered
        working-directory: figures
        run: uv run python ../tools/check_tags.py ..

      - name: No literal color outside ds/tokens.css
        working-directory: figures
        run: uv run python ../tools/check_hexes.py ..

      - name: Contrast floors
        working-directory: figures
        run: uv run python ../tools/check_contrast.py ..

      # Re-vendor from the pinned 3L-design commit and prove the committed copy
      # matches. Clones upstream since only this repo is checked out here.
      # 3L-design is private: the clone goes over SSH with a read-only deploy
      # key (DESIGN_DEPLOY_KEY secret; public half lives in 3L-design's deploy
      # keys). The pin file still records the canonical https URL.
      - name: Design system drift
        working-directory: figures
        env:
          DESIGN_DEPLOY_KEY: ${{ secrets.DESIGN_DEPLOY_KEY }}
          SYNC_DESIGN_UPSTREAM: git@github.com:mjrskiles/3L-design.git
        run: |
          if [ -z "$DESIGN_DEPLOY_KEY" ]; then
            echo "::error::DESIGN_DEPLOY_KEY secret is not set — the drift check cannot clone the private 3L-design repo"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DESIGN_DEPLOY_KEY" > ~/.ssh/design_key
          chmod 600 ~/.ssh/design_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/design_key -o IdentitiesOnly=yes"
          uv run python ../tools/sync_design.py
          cd .. && git diff --exit-code -- assets/css/ds static/fonts data/design-system.yaml

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    # Only main deploys. Every other branch still builds and gets checked above.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
